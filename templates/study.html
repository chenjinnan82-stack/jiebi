<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>接笔 · 一张共写的纸</title>
<style>
:root{color-scheme:light;--ink:#243e44;--muted:#60777c;--paper:#fafbf7;--human:#316c67;--ai:#9d5c6e;--edge:#ccd7d5;--desk:#dce6e8;--back:#afc3c8}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--desk);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 40% 20%,#f4f8f880,transparent 70%)}button,input,textarea,select{font:inherit}select{min-height:40px;border:1px solid var(--edge);background:var(--paper);color:var(--ink);padding:7px;border-radius:5px}button{color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible,canvas:focus-visible,summary:focus-visible{outline:2px solid var(--human);outline-offset:3px}button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.memo{position:relative;width:min(600px,calc(100vw - 40px));margin:24px auto 30px;transform-origin:100% 100%;transition:transform .26s cubic-bezier(.2,.75,.2,1),opacity .2s,visibility .26s;filter:drop-shadow(0 12px 25px #233d4516)}.memo[data-open=false]{transform:translate(30px,24px) rotate(2deg) scale(.92);opacity:0;visibility:hidden;pointer-events:none}.memo-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 4px 14px}.memo-head h1{font:500 25px "Songti SC",serif;margin:0;letter-spacing:.12em}.head-actions{display:flex;gap:5px}.icon{border:0;background:transparent;display:grid;place-items:center;width:44px;height:44px;border-radius:50%}.icon:hover{background:#ffffff60}
.pad{background:var(--back);padding:7px 7px 10px;border-radius:9px 9px 3px 3px;box-shadow:0 1px 0 #ffffffaa inset}.sheet{position:relative;background:var(--paper);border:1px solid #dde3df;box-shadow:1px 3px 0 #e9eee9,2px 6px 0 #c2cecd;overflow:hidden}.sheet:after{content:"";position:absolute;right:0;bottom:0;width:23px;height:23px;background:linear-gradient(135deg,transparent 49%,#e5ece8 50%,#d3dfdc);pointer-events:none}.paper-surface{position:relative}.paper-surface canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}.paper-note{position:absolute;left:7.5%;top:5.4%;width:85%;height:12%;border:0;padding:0;resize:none;background:var(--paper);color:var(--human);font:17px/1.7 "Kaiti SC","STKaiti",serif}.paper-note::placeholder{color:#78908d}.paper-note:focus{outline:1px dashed #a7bfba;outline-offset:5px}.paper-label{position:absolute;left:7.5%;top:2%;font:11px sans-serif;letter-spacing:.1em;color:var(--muted);pointer-events:none}#margins{position:absolute;left:7.5%;right:7.5%;bottom:4%;max-height:18%;overflow:auto;padding:0;margin:0;list-style:none;background:var(--paper)}#margins li{display:flex;align-items:start;gap:10px;font:18px/1.55 "Kaiti SC","STKaiti",serif;color:var(--ai);padding:5px 0}#margins li+li{border-top:1px solid #eee7e8}#margins span{flex:1}#margins button{flex:none;border:0;background:transparent;width:30px;min-height:30px;font:17px sans-serif;color:#708085;opacity:.7}#margins button:hover{opacity:1}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px 6px}.tools{display:flex;gap:3px;align-items:center}.tools button{min-width:44px;min-height:44px;border:0;border-radius:6px;background:transparent;padding:8px 11px;font-size:13px}.tools button:hover{background:#ffffff70}.tools button[aria-pressed=true]{background:#f9fbf7;box-shadow:0 2px 6px #25464c0b}.rule{width:1px;height:20px;background:#a8bbbe;margin:0 3px}.send{border:0;border-radius:7px;background:var(--ink);color:#f9fbf7;min-height:44px;padding:10px 18px;font-size:13px;white-space:nowrap}.send:hover{background:#35565e}.status-row{display:flex;gap:16px;align-items:start;justify-content:space-between;padding:4px 4px 0;min-height:24px;font-size:12px;color:var(--muted)}#status{line-height:1.6;max-width:75%}#saved{white-space:nowrap;font-size:11px}
details{margin:12px 4px 0;font-size:12px;color:var(--muted)}summary{cursor:pointer;width:max-content;padding:8px 0}.study-tools{border-top:1px solid #bdced0;padding:15px 0;line-height:1.7}.study-tools button{border:1px solid #b6c8cb;background:#eff5f4;color:var(--ink);border-radius:5px;min-height:40px;padding:7px 12px}.study-tools label{display:block;margin-bottom:5px}.study-tools input{width:100%;border:1px solid #b6c8cb;background:#f8faf7;border-radius:4px;padding:10px;font-size:13px;color:var(--ink);margin-bottom:12px}#history{list-style:none;padding:0;margin:14px 0}a{color:var(--human)}.provenance{font-size:11px}.test-actions{display:flex;gap:8px;flex-wrap:wrap}
.launcher{position:fixed;right:30px;bottom:28px;display:flex;align-items:center;gap:14px;border:0;border-radius:8px;background:var(--paper);padding:10px 18px 10px 10px;min-width:160px;box-shadow:0 7px 28px #253d4522;transition:opacity .18s,transform .2s}.launcher[hidden]{display:none}.mini{width:48px;height:54px;background:var(--paper);border:1px solid #dce4de;transform:rotate(-5deg);box-shadow:2px 3px 0 #d0dcda}.launcher-copy{text-align:left;font:18px "Songti SC",serif}.launcher-copy small{display:block;margin-top:6px;font:11px sans-serif;color:var(--muted)}.badge{display:none;width:7px;height:7px;border-radius:50%;background:var(--ai);margin-left:5px}.launcher[data-state=ready] .badge,.launcher[data-state=waiting] .badge{display:inline-block}.launcher[data-state=waiting] .badge{background:var(--human);animation:breathe 1.8s ease-in-out infinite}@keyframes breathe{50%{opacity:.25}}
@media(min-height:760px){.memo{width:min(600px,calc((100dvh - 205px)*.878),calc(100vw - 40px))}}@media(max-width:500px){.memo{width:calc(100vw - 20px);margin:12px auto}.toolbar{gap:5px;flex-wrap:wrap}.send{margin-left:auto}.tools button{padding:8px}.paper-note{font-size:15px}#margins li{font-size:16px}.launcher{right:18px;bottom:18px}.status-row{padding:4px}.memo-head{padding-bottom:7px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<main class="memo" id="memo" data-open="true" aria-label="接笔备忘录">
 <header class="memo-head"><h1>接笔</h1><div class="head-actions"><button class="icon" id="clear" aria-label="新一张纸，可撤销" title="新一张纸"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM15 3v5h4M9 13h7M9 17h5"/></svg></button><button class="icon" id="fold" aria-label="仅收起，不请求回应" title="仅收起"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button></div></header>
 <div class="pad"><section class="sheet" aria-label="共写的纸"><div class="paper-surface">
  <canvas id="paper" width="720" height="820" tabindex="0" aria-label="绘画纸面。回车选择下一笔，方向键移动，R旋转，Delete删除，Command Z撤销。"></canvas>
  <span class="paper-label" aria-hidden="true">这一页</span><textarea id="paper-text" class="paper-note" maxlength="2000" aria-label="写在纸上的话" placeholder="想留下一点什么？"></textarea>
  <ul id="margins" tabindex="0" aria-label="AI留下的文字，可滚动查看"></ul>
 </div></section></div>
 <div class="toolbar"><div class="tools" aria-label="纸笔工具"><button data-mode="draw" aria-pressed="true">画笔</button><button data-mode="move" aria-pressed="false">移动</button><button data-mode="erase" aria-pressed="false">擦除</button><span class="rule" aria-hidden="true"></span><button id="undo" aria-label="撤销" title="撤销"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5-5 5 5 5M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -3)"/></svg></button></div><button class="send" id="fold-send">收起，留给 AI</button></div>
 <div class="status-row"><div id="status" role="status" aria-live="polite"></div><span id="saved" role="status">本机保存</span></div>
 <details id="study"><summary>试验台</summary><div class="study-tools"><label for="cue">只告诉这一轮的话（可留空）</label><input id="cue" maxlength="500" autocomplete="off"><div class="test-actions"><button id="next">展开着接笔</button><button id="rotate">旋转选中笔画</button><label for="scenario">实测场景</label><select id="scenario"></select><button id="demo">录制本场两轮</button></div><ul id="history" aria-label="每轮真实耗时"></ul><div id="result"></div><p><a href="/evidence/scenes-20261028/index.html" target="_blank">三种情境的实测对照</a></p><p class="provenance">{{ model }} · <a href="https://github.com/yael-vinker/SketchAgent" target="_blank" rel="noreferrer">SketchAgent / MIT</a> · 绿色为你的笔迹，玫红为 AI。录制时人的操作由脚本演示，AI 当场生成。</p><p>网页原型，尚未接个人助手。收起后可继续生成；关闭或刷新网页会中断等待。邀请时才发送当前纸面和文字。</p></div></details>
</main>
<button id="unfold" class="launcher" aria-label="展开接笔备忘录" aria-controls="memo" aria-expanded="true" data-state="idle" hidden><canvas id="mini" class="mini" width="144" height="164" aria-hidden="true"></canvas><span class="launcher-copy">接笔<span class="badge" aria-hidden="true"></span><small id="fold-status" aria-live="polite">这一页还在</small></span></button>
<script type="module" src="/static/study.mjs"></script></html>
