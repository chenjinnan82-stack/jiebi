# Include only inside the existing sanliang.online HTTPS server block.
# Do not replace its other locations, certificate or proxy settings.
location = /jiebi { return 301 /jiebi/; }
location /jiebi/api/ {
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:5332/api/;
    proxy_set_header Host 127.0.0.1:5332;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 70s;
    proxy_send_timeout 15s;
    add_header Cache-Control "no-store" always;
}
location /jiebi/ {
    alias /opt/jiebi/current/public/;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
