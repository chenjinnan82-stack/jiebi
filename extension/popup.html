<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接笔</title><link rel="stylesheet" href="popup.css"></head><body>
<div id="curtain" data-expanded="false" data-phase="idle">
<div class="paper-clip"><main id="paper-body" inert>
<header><h1>接笔</h1><button id="save-only" aria-label="只保存并收起，不交给助手" title="只保存并收起 · Esc"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button><button id="more-toggle" aria-label="更多" aria-expanded="false" aria-controls="more" title="更多">···</button></header>
<section class="sheet" aria-label="共写的纸"><div class="drawing"><canvas id="paper" aria-describedby="paper-reading" width="612" height="612" tabindex="0" aria-label="图文纸面。文字模式点击落字，选择模式框选和拖动；双击或Shift Enter编辑文字，方向键移动，Delete删除，Command G编组，Command Z撤销。"></canvas><textarea id="text-editor" maxlength="2000" aria-label="纸上的文字" placeholder="留下一点什么……" hidden></textarea></div><p id="paper-reading" class="sr-only"></p></section>
<button id="paper-corner" aria-label="掀起纸角，取新纸或旧纸" title="掀起纸角，取新纸或旧纸"><span aria-hidden="true"></span></button>
<footer><div id="mode-edge" role="group" tabindex="0" aria-label="左右拨动切换写字和画画，键盘使用左右方向键" title="左右拨动，换一支笔"><span id="mode-word" class="sr-only">写字</span><button id="mode-text" aria-label="写字，可向左拨动纸沿" aria-pressed="true" title="写字 · T">写字</button><button id="mode-draw" aria-label="画画，可向右拨动纸沿" aria-pressed="false" title="画画 · P">画画</button></div><nav aria-label="整理纸面"><button data-tool="select" aria-label="选择与移动" title="选择与移动 · V" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-7 1-3 7z"/></svg></button><button data-tool="erase" aria-label="擦除整笔或文字" title="擦除 · E" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 14L14 4l7 7-9 9H9zM8 10l7 7M12 20h9"/></svg></button><button id="undo" aria-label="撤销上一次修改" title="撤销 · ⌘Z"><svg viewBox="0 0 24 24"><path d="M8 5L3 10l5 5M3 10h11a6 6 0 010 12"/></svg></button></nav><div id="edit-actions" hidden><button id="finish-text" hidden>写好了</button><button id="edit-selected" hidden>编辑文字</button><button id="group" hidden>编组</button><button id="delete-selected" hidden>删除</button></div></footer>
<p id="status" role="status" aria-live="polite"></p>
<section id="more" hidden aria-label="更多操作"><label id="text-sizing" hidden><span >文字宽度</span><input id="text-width" type="range" min="88" max="576" step="1" aria-label="文字框宽度"></label><button id="close" aria-label="收卷并交给助手" disabled>收卷并交给助手 <kbd>⌘↵</kbd></button><button id="history-toggle" aria-expanded="false" aria-controls="history">这张纸的往来</button><button id="export">保存这张纸</button><button id="legacy">旧版纸面</button><button id="retry" hidden>重试回应</button><details><summary>助手连接</summary><label class="connection-label" for="recipient">这张纸交给</label><select id="recipient"><option value="builtin">内置助手</option><option value="external">外部助手（测试）</option></select><label class="connection-label" for="service-location">连接服务</label><select id="service-location"><option value="http://127.0.0.1:5331">本机</option><option value="https://sanliang.online/jiebi">评审服务</option></select><label class="connection-label" for="access-code">评审访问码</label><input id="access-code" type="password" autocomplete="off" maxlength="256"><button id="save-connection">保存连接</button><p id="connection">尚未检查连接。</p><button id="check-connection">检查连接</button></details><section id="history" hidden aria-label="往来记录"><ol id="receipts"></ol></section></section>
<section id="paper-stack" hidden aria-label="纸叠"><div class="stack-heading"><span>纸叠</span><button id="stack-close" aria-label="收好纸叠">×</button></div><div id="paper-cards"></div></section>
</main></div>
<button id="roll-handle" aria-label="拉开接笔" title="向下拉开，向上收卷交给助手"><span class="roll-name">接笔</span><span class="roll-seam" aria-hidden="true"></span><span class="roll-grip" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 14l6-5 6 5"/></svg></span><span class="roll-mark" aria-hidden="true"></span></button>
</div>
<dialog id="reply"><div class="dialog-head"><h2 id="reply-title">交出时的那一页</h2><button id="close-reply" aria-label="关闭往来">×</button></div><p id="reply-status"></p><p id="reply-words"></p><canvas id="reply-paper" width="612" height="612" aria-label="只读纸面"></canvas><p id="reply-note"></p><div class="reply-actions"><button id="save-reply">保存这张纸</button><button id="collect">回到当前纸面</button></div></dialog><script type="module" src="popup.mjs"></script></body></html>
